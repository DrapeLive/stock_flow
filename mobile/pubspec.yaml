name: stock_flow_admin
description: Stock Flow Admin - warehouse management companion for XL Apparals.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State / DI / routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Local persistence
  hive_ce: ^2.8.3
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.4

  # Connectivity / offline banner
  connectivity_plus: ^6.1.0

  # Images
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  image_picker: ^1.1.2
  image: ^4.3.0
  file_picker: ^8.1.2

  # QR
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # PDF / share / open
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  open_filex: ^4.5.0

  # Spreadsheets for bulk import
  excel: ^4.0.6

  # Charts
  fl_chart: ^0.69.0

  # Utils
  intl: ^0.20.1
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  audioplayers: ">=6.6.0 <6.7.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/scan_beep.wav

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21